<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sherlockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#07090e" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#sherlockGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Outer Crosshair / Radar Ring -->
  <circle cx="28" cy="28" r="18" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
  
  <!-- Magnifying Glass Lens -->
  <circle cx="28" cy="28" r="14" fill="#0c1322" stroke="url(#sherlockGrad)" stroke-width="3.5" filter="url(#neonGlow)" />
  <circle cx="28" cy="28" r="14" fill="url(#sherlockGrad)" fill-opacity="0.15" />
  
  <!-- Target Center Dot & Crosshair -->
  <circle cx="28" cy="28" r="3" fill="#38bdf8" />
  <line x1="28" y1="18" x2="28" y2="23" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="28" y1="33" x2="28" y2="38" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="28" x2="23" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="33" y1="28" x2="38" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  
  <!-- Lens Handle -->
  <line x1="39" y1="39" x2="52" y2="52" stroke="url(#sherlockGrad)" stroke-width="5" stroke-linecap="round" />
  <circle cx="52" cy="52" r="2.5" fill="#6366f1" />
</svg>
