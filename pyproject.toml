[project]
name = "sherlock-project"
version = "0.16.2"
description = "Hunt down social media accounts by username across social networks"
readme = "docs/pyproject/README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=21.2.0",
    "requests>=2.28.0",
    "requests-futures>=1.0.0",
    "reportlab>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "phonenumbers>=8.13.0",
    "certifi>=2023.7.22",
    "colorama>=0.4.6",
    "PySocks>=1.7.1",
    "stem>=1.8.2",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "tomli>=2.0.1",
]

[build-system]
requires = [ "poetry-core>=1.2.0" ]
build-backend = "poetry.core.masonry.api"

[tool.poetry-version-plugin]
source = "init"

[tool.poetry]
name = "sherlock-project"
version = "0.16.2"
description = "Hunt down social media accounts by username across social networks"
license = "MIT"
authors = [
    "Siddharth Dushantha <siddharth.dushantha@gmail.com>"
]
maintainers = [
    "Paul Pfeister <code@pfeister.dev>",
    "Matheus Felipe <matheusfelipeog@protonmail.com>",
    "Sondre Karlsen Dyrnes <sondre@villdyr.no>"
]
readme = "docs/pyproject/README.md"
packages = [ { include = "sherlock_project"} ]
keywords = [ "osint", "reconnaissance", "information gathering" ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security"
]
homepage = "https://sherlockproject.xyz/"
repository = "https://github.com/sherlock-project/sherlock"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/sherlock-project/sherlock/issues"

[tool.poetry.dependencies]
python = "^3.9"
certifi = ">=2019.6.16"
colorama = "^0.4.1"
PySocks = "^1.7.0"
requests = "^2.22.0"
requests-futures = "^1.0.0"
stem = "^1.8.0"
pandas = "^2.2.1"
openpyxl = "^3.0.10"
tomli = "^2.2.1"

[tool.poetry.group.dev.dependencies]
jsonschema = "^4.0.0"
rstr = "^3.2.2"
pytest = "^8.4.2"
pytest-xdist = "^3.8.0"

[tool.poetry.group.ci.dependencies]
defusedxml = "^0.7.1"

[tool.poetry.group.web.dependencies]
flask = "^3.0.0"

[tool.poetry.scripts]
sherlock = 'sherlock_project.sherlock:main'
